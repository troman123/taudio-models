# taudio-models manifest
# Weights NEVER in git.
# Dual registry: public assets + public capabilities (generic names).
# Internal short names live only in closed TaudioProcess.
# Canonical manifest (packaged into the wheel). Repo-root manifest.yaml is a symlink here.
schema_version: 3

param_presets:
  device:
    name: device
    type: enum
    default: auto
    choices: [auto, cpu, cuda, mps]
    description: Inference device
  is_gpu:
    name: is_gpu
    type: bool
    default: true
    description: Prefer GPU when available

# ---------------------------------------------------------------------------
# Public assets (generic stable ids — NOT internal de2/de3)
# ---------------------------------------------------------------------------
assets:
  deepfilternet:
    display_name: DeepFilterNet
    lib: libs/DeepFilterNet
    upstream_ref: DeepFilterNet
    download: upstream
    license_spdx: Apache-2.0 OR MIT
    license_file: licenses/deepfilternet/LICENSE
    description: Upstream pretrained DeepFilterNet v1

  deepfilternet2:
    display_name: DeepFilterNet2
    lib: libs/DeepFilterNet
    upstream_ref: DeepFilterNet2
    download: upstream
    license_spdx: Apache-2.0 OR MIT
    license_file: licenses/deepfilternet/LICENSE
    description: Upstream pretrained DeepFilterNet v2

  deepfilternet3:
    display_name: DeepFilterNet3
    lib: libs/DeepFilterNet
    upstream_ref: DeepFilterNet3
    download: upstream
    license_spdx: Apache-2.0 OR MIT
    license_file: licenses/deepfilternet/LICENSE
    description: Upstream pretrained DeepFilterNet v3 (default denoise asset)

  melband_vocals:
    display_name: MelBand RoFormer Vocals
    lib: libs/MelBandRoformer
    upstream_ref: MelBandRoformer.ckpt
    download: manual
    config_path: configs/config_vocals_mel_band_roformer.yaml
    license_spdx: MIT
    license_file: licenses/melro/NOTICE
    description: Mel-band RoFormer vocal separation (checkpoint manual/cache; not in git)

  audio_separator:
    display_name: Audio Separator (RoFormer / MDX)
    lib: libs/audio_separatorv
    upstream_ref: audio-separator-models
    download: manual
    model_store_subdir: audio-separator-models
    license_spdx: MIT
    license_file: licenses/audio_separatorv/NOTICE
    description: >-
      Karaoke / vocal-inst separation via audio-separator stack;
      weights manual under cache audio-separator-models/ (rofep, melk2, …)

  demucs:
    display_name: Demucs
    lib: libs/demucsv
    upstream_ref: hdemucs_mmi
    download: upstream
    license_spdx: MIT
    license_file: licenses/demucs/NOTICE
    description: Demucs stem separation (weights via demucs pretrained cache)

  hpss:
    display_name: HPSS (librosa)
    lib: libs/hpss
    upstream_ref: librosa
    download: none
    license_spdx: ISC
    license_file: licenses/hpss/NOTICE
    description: Harmonic/percussive separation via librosa (no checkpoint)

  bandit:
    display_name: Bandit (DnR)
    lib: libs/banditv
    upstream_ref: dnr-3s-bark48-l1snr
    download: urls
    license_spdx: Apache-2.0
    license_file: licenses/bandit/LICENSE
    description: >-
      Cinematic stem separation (speech/music/effects);
      weights via Zenodo / TAUDIO_BANDIT_DIR (db48/db64)

  resemble:
    display_name: Resemble Enhance
    lib: libs/resemble_enhancev
    upstream_ref: enhancer_stage2
    download: upstream
    license_spdx: MIT
    license_file: licenses/resemble_enhance/LICENSE
    description: Speech enhance / denoise (ResembleAI weights via HF)

# ---------------------------------------------------------------------------
# Public capabilities (generic — NOT internal dn.speech)
# ---------------------------------------------------------------------------
capabilities:
  denoise.speech:
    display_name: Speech denoise
    default_asset: deepfilternet3
    kind: denoise
    description: Generic speech denoising via DeepFilterNet family

  separate.vocal:
    display_name: Vocal separation
    default_asset: melband_vocals
    kind: separate
    description: Vocal / instrumental separation via MelBand RoFormer

  separate.karaoke:
    display_name: Karaoke / stem separation
    default_asset: audio_separator
    kind: separate
    description: Vocal / instrumental separation via Audio Separator (MDX / RoFormer)

  separate.demucs:
    display_name: Demucs instrumental filter
    default_asset: demucs
    kind: separate
    description: Demucs mute-vocals / instrumental mix (dmiv)

  separate.hpss:
    display_name: HPSS
    default_asset: hpss
    kind: separate
    description: Harmonic/percussive separation (hpiv)

  separate.bandit:
    display_name: Bandit cinematic stems
    default_asset: bandit
    kind: separate
    description: Bandit speech/music/effects (bdiv)

  enhance.resemble:
    display_name: Resemble Enhance
    default_asset: resemble
    kind: enhance
    description: Resemble speech enhance / denoise (reenh)

# ---------------------------------------------------------------------------
# Catalog (legacy ModelRegistry cards; deepfilter wired for MVP)
# ---------------------------------------------------------------------------
catalog:
  ause:
    display_name: Audio Separator (RoFormer / MDX)
    description: Vocal / instrumental / lead / backing separation via audio-separator stack
    lib: libs/audio_separatorv
    aliases: [ausev, ausevl, ausevb, ausei, auseiv]
    requires_models: []
    capabilities: [separate_vocals, separate_instrumental, separate_lead, separate_backing]
    output_stems: [vocals, instrumental, lead, backing]
    license_spdx: TBD
    license_file: licenses/audio_separatorv/LICENSE
    redistributable: true
    status: scaffold
    params:
      - name: variant
        type: enum
        default: vocal
        choices: [vocal, vocallead, vocalback, instrumental, iv]
      - name: model_weight
        type: enum
        default: rofep
        choices: [rofep, melk2, rofk2, rofk1]
      - name: split
        type: bool
        default: false
      - name: device
        type: enum
        default: auto
        choices: [auto, cpu, cuda, mps]
      - name: is_gpu
        type: bool
        default: true

  melro:
    display_name: MelBand RoFormer
    description: Mel-band RoFormer vocal / instrumental separation
    lib: libs/mel_band_roformer
    aliases: [melrov, melroi, melroiv]
    requires_models: []
    capabilities: [separate_vocals, separate_instrumental]
    output_stems: [vocals, instrumental]
    license_spdx: TBD
    license_file: licenses/melro/LICENSE
    redistributable: true
    status: planned
    params:
      - name: variant
        type: enum
        default: vocal
        choices: [vocal, instrumental, iv]
      - name: device
        type: enum
        default: auto
        choices: [auto, cpu, cuda, mps]
      - name: is_gpu
        type: bool
        default: true

  demucs:
    display_name: Demucs
    description: Demucs instrumental / multi-stem separation
    lib: libs/demucsv
    aliases: [dmiv]
    requires_models: []
    capabilities: [separate_vocals, separate_instrumental]
    output_stems: [vocals, instrumental]
    license_spdx: MIT
    license_file: licenses/demucs/LICENSE
    redistributable: true
    status: planned
    params:
      - name: device
        type: enum
        default: auto
        choices: [auto, cpu, cuda, mps]
      - name: is_gpu
        type: bool
        default: true

  deepfilter:
    display_name: DeepFilterNet
    description: Speech denoise / enhancement (catalog bridge to public assets)
    lib: libs/DeepFilterNet
    aliases: []
    weight_ids: []
    capabilities: [denoise, enhance]
    output_stems: [other]
    license_spdx: Apache-2.0 OR MIT
    license_file: licenses/deepfilternet/LICENSE
    redistributable: true
    status: available
    params:
      - name: version
        type: enum
        default: "3"
        choices: ["1", "2", "3"]
        description: DeepFilterNet major version -> public asset deepfilternet{N}
      - name: device
        type: enum
        default: auto
        choices: [auto, cpu, cuda, mps]
      - name: is_gpu
        type: bool
        default: false
        description: Prefer GPU when available
      - name: pf
        type: bool
        default: false
        description: Enable DeepFilterNet post-filter

# Downloadable weight files via urls (empty for DF — uses upstream download)
weights: {}
